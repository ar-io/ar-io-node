name: test-core

on: [workflow_dispatch]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # Setup
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      # macOS specific setup
      - run: brew install python-setuptools
        if: matrix.os == 'macos-latest'

      # Build and test TypeScript
      - run: yarn --immutable --immutable-cache
      - run: yarn build
      - run: yarn lint:check
      # Typecheck including test files. `yarn build` uses tsconfig.prod.json,
      # which excludes **/*.test.ts, and `yarn test` runs via a type-stripping
      # loader — so without this, type errors in test code reach no CI gate.
      - run: yarn typecheck
      - run: yarn test:ci
      - name: Build core Docker image
        if: matrix.os == 'ubuntu-latest'
        run: docker build -t core .
      - name: Run E2E tests
        if: matrix.os == 'ubuntu-latest'
        run: yarn test:e2e
        env:
          TEST_SKIP_TAGS: flaky
          USE_PREBUILT_IMAGE: 'true'
