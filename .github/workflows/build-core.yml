name: build-core

on: [push, workflow_dispatch]

# A newer push to the same branch makes an older run pointless, so cancel it.
# develop and main are exempt: each of their commits publishes its own image,
# so each run gets a group of its own. (A shared group, even without
# cancel-in-progress, keeps only one pending run and drops the others.) A
# re-run gets its own group too: it carries its original commit, and must not
# cancel the run of a newer one on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ ((github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && github.run_id) || (github.run_attempt != '1' && format('{0}-{1}', github.run_id, github.run_attempt)) || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # Linux only on every push. macOS runs in `test-macos` below, on
      # main only: as a leg of this matrix it cost 10x the
      # minutes on every branch push, ran twice as long, failed on its own
      # flaky tests (FSEvents timing, S3DataStore) on unrelated PRs, and held
      # up `images`, which needs this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Backstop only. A hung poll used to run out the 360-minute default and
    # burn a runner; the E2E waits now time out on their own well before this.
    # Sized to the whole job, not the test suite: it also builds the core
    # Docker image and, on develop and main, runs the E2E tests (~7-9 minutes)
    # after the unit suite. The unit suite under coverage takes ~14 minutes on
    # a fast runner and ~21-23 on a slow one (measured 2026-10), so a healthy
    # develop run lasts 22-42 minutes. 40 cancelled four healthy develop runs
    # mid-E2E in one day, and an earlier 20 cancelled them mid-image-build.
    #
    # Still under the old 60, which was generous enough that a hung test
    # process burned a full hour and silently skipped the `images` job that
    # publishes release containers -- such a run reads "cancelled" rather than
    # "failed", so nothing surfaces as broken. Paired with --test-force-exit
    # and --test-timeout in the test scripts.
    timeout-minutes: 55
    permissions:
      checks: write
      contents: read
      packages: write
      pull-requests: write

    steps:
      # Setup
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      # Build and test TypeScript
      - run: yarn --immutable --immutable-cache
      - run: yarn build
      - run: yarn lint:check
      # `yarn build` uses tsconfig.prod.json, which excludes *.test.ts, so
      # this is the only per-push check that type-checks test code. It must
      # stay at zero errors.
      - run: yarn typecheck
      - run: yarn test:ci
      # Run E2E tests on the integration and release branches only.
      #
      # Deliberately post-merge rather than per-PR. E2E itself is cheap (~5 min)
      # but it needs the core image, and that build is ~7 min — on `on: [push]`
      # that cost would land on every work-in-progress commit on every branch.
      # The trade accepted here is detection over prevention: a bad change lands
      # on develop and is caught there, rather than being blocked before merge.
      #
      # `main` is included because releases are cut by merging develop into it
      # (see CONTRIBUTING.md), and a release branch with no E2E coverage is the
      # worst place to find out something broke.
      #
      # Two tags for one build. `core` is what the GenericContainer suites
      # ask for; the ghcr tag is what docker-compose.yaml resolves via
      # CORE_IMAGE_TAG. Without the second one, compose pulls the published
      # `latest` and the compose-based suites test a different build than the
      # commit under test.
      - name: Build core Docker image
        if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && matrix.os == 'ubuntu-latest'
        run: |
          docker build \
            -t core \
            -t ghcr.io/ar-io/ar-io-core:ci-${{ github.sha }} .
      - name: Run E2E tests
        id: e2e
        if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && matrix.os == 'ubuntu-latest'
        run: yarn test:e2e
        env:
          TEST_SKIP_TAGS: flaky
          USE_PREBUILT_IMAGE: 'true'
          # The E2E suites wipe ./data/sqlite before running. cleanDb refuses to
          # do that unless this is set, so a developer can't lose a live gateway
          # index by running `yarn test:e2e` locally. A CI runner has no index to
          # lose, so opting in here is safe.
          ALLOW_DESTRUCTIVE_E2E: 'true'
          CORE_IMAGE_TAG: ci-${{ github.sha }}
      # E2E failures give no upstream detail without the container logs.
      # Testcontainers randomizes the compose project name, so enumerate
      # whatever containers survive instead of naming a project.
      - name: Dump container logs on E2E failure
        if: failure() && steps.e2e.conclusion == 'failure'
        run: |
          docker ps -a || true
          for c in $(docker ps -aq); do
            echo "===== $(docker inspect -f '{{.Name}} {{.Config.Image}}' "$c") ====="
            docker logs --tail 300 "$c" 2>&1 || true
          done

      # Codecov report
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Slack notifications. Dependabot runs cannot read repository secrets,
      # so SLACK_WEBHOOK is empty there and the notify action fails, turning a
      # green dependency bump red. Skip them for Dependabot.

      # Success notification
      - name: Send Slack success notification
        if: success() && github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest' && github.actor != 'dependabot[bot]'
        env:
          SLACK_TITLE: Build succeeded!
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: rtCamp/action-slack-notify@v2

      # Failure notification
      - name: Send Slack failure notification
        if: failure() && github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest' && github.actor != 'dependabot[bot]'
        env:
          SLACK_TITLE: Build failed!
          SLACK_COLOR: danger
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: rtCamp/action-slack-notify@v2

  # macOS coverage at release time, off the critical path. Gateways run in
  # Linux containers, so this only guards against breaking local development
  # on macOS: it runs on pushes to main (a release) and nothing depends on it
  # (in particular not `images`), and a failure reports to Slack instead of
  # blocking anything. It no longer runs on every merge to develop, where it
  # cost about 10x the Linux job's minutes per merge. Dispatching the
  # workflow by hand runs it on any branch
  # (`gh workflow run build-core.yml --ref <branch>`), to check a macOS fix
  # before it merges.
  test-macos:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
      - run: brew install python-setuptools
      - run: yarn --immutable --immutable-cache
      - run: yarn build
      # c8 merges every test process's coverage into one report after the
      # tests finish. That peaks just over 2 GB, node's default heap on the
      # 7 GB macOS runners (the Linux runners' default is higher), so the job
      # died there twice with every test passed.
      - run: yarn test:ci
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Send Slack failure notification
        if: failure()
        env:
          SLACK_TITLE: macOS build failed (non-blocking)
          SLACK_COLOR: danger
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: rtCamp/action-slack-notify@v2

  images:
    runs-on: ubuntu-latest

    needs: test
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/r')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image to GitHub Container Registry
        uses: docker/build-push-action@v5
        with:
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/ar-io/ar-io-core:latest
            ghcr.io/ar-io/ar-io-core:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/r') && format('ghcr.io/ar-io/ar-io-core:{0}', github.ref_name) || '' }}
