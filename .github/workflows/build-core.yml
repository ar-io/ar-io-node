name: build-core

on: [push, workflow_dispatch]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Backstop only. A hung poll used to run out the 360-minute default and
    # burn a runner; the E2E waits now time out on their own well before this.
    # Sized to the whole job, not the test suite: a healthy ubuntu run takes
    # ~21 minutes because it also builds the core Docker image and runs the
    # E2E tests after the ~3-minute unit suite. (An earlier value of 20 was set
    # from the suite time alone and cancelled healthy builds mid-image-build.)
    #
    # Still well under the previous 60, which was generous enough that a hung
    # test process burned a full hour and silently skipped the `images` job
    # that publishes release containers -- such a run reads "cancelled" rather
    # than "failed", so nothing surfaces as broken. Paired with
    # --test-force-exit and --test-timeout in the test scripts.
    timeout-minutes: 40
    permissions:
      checks: write
      contents: read
      packages: write
      pull-requests: write

    steps:
      # Setup
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      # macOS specific setup
      - run: brew install python-setuptools
        if: matrix.os == 'macos-latest'

      # Build and test TypeScript
      - run: yarn --immutable --immutable-cache
      - run: yarn build
      - run: yarn lint:check
      - run: yarn test:ci
      # Run E2E tests if pushing to develop branch
      # Two tags for one build. `core` is what the GenericContainer suites
      # ask for; the ghcr tag is what docker-compose.yaml resolves via
      # CORE_IMAGE_TAG. Without the second one, compose pulls the published
      # `latest` and the compose-based suites test a different build than the
      # commit under test.
      - name: Build core Docker image
        if: github.ref == 'refs/heads/develop' && matrix.os == 'ubuntu-latest'
        run: |
          docker build \
            -t core \
            -t ghcr.io/ar-io/ar-io-core:ci-${{ github.sha }} .
      - name: Run E2E tests
        id: e2e
        if: github.ref == 'refs/heads/develop' && matrix.os == 'ubuntu-latest'
        run: yarn test:e2e
        env:
          TEST_SKIP_TAGS: flaky
          USE_PREBUILT_IMAGE: 'true'
          CORE_IMAGE_TAG: ci-${{ github.sha }}
      # E2E failures give no upstream detail without the container logs.
      # Testcontainers randomizes the compose project name, so enumerate
      # whatever containers survive instead of naming a project.
      - name: Dump container logs on E2E failure
        if: failure() && steps.e2e.conclusion == 'failure'
        run: |
          docker ps -a || true
          for c in $(docker ps -aq); do
            echo "===== $(docker inspect -f '{{.Name}} {{.Config.Image}}' "$c") ====="
            docker logs --tail 300 "$c" 2>&1 || true
          done

      # Codecov report
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Success notification
      - name: Send Slack success notification
        if: success() && github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          SLACK_TITLE: Build succeeded!
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: rtCamp/action-slack-notify@v2

      # Failure notification
      - name: Send Slack failure notification
        if: failure() && github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          SLACK_TITLE: Build failed!
          SLACK_COLOR: danger
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: rtCamp/action-slack-notify@v2

  images:
    runs-on: ubuntu-latest

    needs: test
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/r')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image to GitHub Container Registry
        uses: docker/build-push-action@v5
        with:
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/ar-io/ar-io-core:latest
            ghcr.io/ar-io/ar-io-core:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/r') && format('ghcr.io/ar-io/ar-io-core:{0}', github.ref_name) || '' }}
